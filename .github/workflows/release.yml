name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build installer (electron-builder)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:win

      - name: List build outputs
        shell: pwsh
        run: |
          Write-Host "=== Build outputs ==="
          Get-ChildItem -Path build -Recurse -File | Select-Object Name, Length, FullName | Format-Table -AutoSize

      - name: Upload .exe and metadata to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 上传 NSIS 安装程序 + 增量更新所需文件
          files: |
            build/*.exe
            build/*.exe.blockmap
            build/latest*.yml
          # 不覆盖已存在的 asset，避免冲突
          fail_on_unmatched_files: false
          generate_release_notes: false

      - name: Upload build artifacts (for debugging)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer
          path: |
            build/*.exe
            build/*.blockmap
            build/latest*.yml
          if-no-files-found: ignore
